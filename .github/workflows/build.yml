name: VYRON Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out VYRON
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Windows installer and portable EXE
        run: npm run dist:win
      - name: Assemble VYRON folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path VYRON | Out-Null
          Copy-Item -Path release/*.exe -Destination VYRON/
          Compress-Archive -Path VYRON -DestinationPath VYRON-Windows.zip -Force
      - name: Upload Windows installer, portable EXE, and VYRON folder
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-Windows
          path: |
            release/*.exe
            VYRON-Windows.zip
          if-no-files-found: error
          retention-days: 30
